<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Crag游戏规则</title>
    <style type="text/css">
        p { text-indent: 2em; }
    </style>
</head>
<body>
<h1 style="text-align:center;">Crag游戏规则</h1>
<h3>游戏玩法</h3>
<p>
    Crag游戏的基本规则类似于快艇骰子。区别是使用2个骰子，每轮至多可以掷2次骰子。
    总共有13种得分项，且计分规则有所差异。
</p>

<h3>计分规则</h3>
<table align="center" border="1">
    <thead>
    <tr>
        <th>得分项</th>
        <th>骰子组合</th>
        <th>得分</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>1</td>
        <td>1点骰子</td>
        <td>所有1点之和</td>
    </tr>
    <tr>
        <td>2</td>
        <td>2点骰子</td>
        <td>所有2点之和</td>
    </tr>
    <tr>
        <td>3</td>
        <td>3点骰子</td>
        <td>所有3点之和</td>
    </tr>
    <tr>
        <td>4</td>
        <td>4点骰子</td>
        <td>所有4点之和</td>
    </tr>
    <tr>
        <td>5</td>
        <td>5点骰子</td>
        <td>所有5点之和</td>
    </tr>
    <tr>
        <td>6</td>
        <td>6点骰子</td>
        <td>所有6点之和</td>
    </tr>
    <tr>
        <td>小顺</td>
        <td>1,2,3</td>
        <td>20</td>
    </tr>
    <tr>
        <td>大顺</td>
        <td>4,5,6</td>
        <td>20</td>
    </tr>
    <tr>
        <td>奇顺</td>
        <td>1,3,5</td>
        <td>20</td>
    </tr>
    <tr>
        <td>偶顺</td>
        <td>2,4,6</td>
        <td>20</td>
    </tr>
    <tr>
        <td>3个同点</td>
        <td>3个相同点数的骰子</td>
        <td>25</td>
    </tr>
    <tr>
        <td>13点</td>
        <td>点数之和为13</td>
        <td>26</td>
    </tr>
    <tr>
        <td>Crag</td>
        <td>点数之和为13且包含一对</td>
        <td>50</td>
    </tr>
    </tbody>
</table>
</body>
</html>
