<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Pig游戏规则</title>
    <style type="text/css">
        p { text-indent: 2em; }
    </style>
</head>
<body>
<h1 style="text-align:center;">Pig游戏规则</h1>
<h3>游戏目标</h3>
<p>游戏的目标是得到100分。</p>

<h3>游戏玩法</h3>
<p>
    游戏使用1个骰子。在每轮中，玩家可以掷任意多次骰子。每次掷骰子后，骰子点数加到本轮得分。
    之后玩家可以决定保存本轮得分(<strong>hold</strong>)或是继续掷骰子。
</p>
<p>如果掷出1点(<strong>Pig</strong>)，则失去本轮得分，但不影响总得分。</p>
<p>当一个玩家决定保存或者掷出1点之后，将轮到下一个玩家，按相同规则进行。</p>
<p>第一个得到100分的玩家获胜。</p>
</body>
</html>
